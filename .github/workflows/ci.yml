name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package for tests
        run: |
          python -m pip install --upgrade pip "setuptools>=83" wheel
          python -m pip install -e ".[all,dev]"
      - name: Run tests
        run: python -m pytest -q
      - name: Enforce coverage
        if: matrix.python-version == '3.12'
        run: python -m pytest -q --cov=crupier --cov-report=term --cov-fail-under=95
      - name: Run lint
        run: python -m ruff check src tests examples
      - name: Check public package types
        if: matrix.python-version == '3.12'
        run: python -m mypy src/crupier
      - name: Audit Python dependencies
        run: python -m pip_audit --skip-editable --progress-spinner off
      - name: Release readiness check
        run: crupier release check
